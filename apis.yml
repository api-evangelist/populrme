name: Populr.me
description: Populr.me was a self-service website builder that let users create and host single-page
  personal and marketing pages on free and paid subscription tiers. Surfaced as a portfolio company of
  500 Global, it was added to the API Evangelist network as a stub. Enrichment found the consumer service
  permanently shut down on June 1, 2023 (users directed to Wix, Weebly, Squarespace, GoDaddy) and no public
  API, developer program, documentation, or event surface remains — only a static shutdown page on the domain.
